<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>KRAK ENGINE v3</title>
    <style>body { background: #0f172a; color: white; padding: 20px; font-family: sans-serif; }</style>
</head>
<body>
    <h1>KRAK ENGINE v3</h1>
    <button id="btn" onclick="lancerAnalyse()">⚡ LANCER L'ANALYSE</button>
    <div id="resultat" style="margin-top: 20px; white-space: pre-wrap;"></div>

    <script>
        async function lancerAnalyse() {
            const btn = document.getElementById('btn');
            const resDiv = document.getElementById('resultat');
            btn.disabled = true;
            resDiv.innerText = "Analyse en cours...";

            try {
                const response = await fetch('/api/auto-analyse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ promptSysteme: "Analyse ces matchs et fais un coupon." })
                });

                const data = await response.json();
                if (data.success) {
                    resDiv.innerText = data.text;
                } else {
                    resDiv.innerText = "Erreur: " + data.error;
                }
            } catch (err) {
                resDiv.innerText = "Erreur de communication.";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
